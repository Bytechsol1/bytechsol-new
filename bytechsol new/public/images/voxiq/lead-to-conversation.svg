28" fill="#a2c0d2" font-size="12" font-weight="400" font-family="Arial,Helvetica,sans-serif">A summary and score</text><text x="925" y="350" fill="#a2c0d2" font-size="12" font-weight="400" font-family="Arial,Helvetica,sans-serif">for the sales rep.</text><rect x="42" y="444" width="682" height="239" rx="12" fill="#f7fbfd" stroke="none"/><text x="66" y="478" fill="#6d8ca2" font-size="9" font-weight="700" font-family="Arial,Helvetica,sans-serif">EXAMPLE QUALIFICATION</text><circle cx="82" cy="520" r="16" fill="#d5f1f6" stroke="none"/><text x="77" y="525" fill="#157997" font-size="13" font-weight="600" font-family="Arial,Helvetica,sans-serif">V</text><text x="111" y="514" fill="#1c435c" font-size="16" font-weight="600" font-family="Arial,Helvetica,sans-serif">Which CRM does your team use?</text><text x="111" y="541" fill="#67899e" font-size="13" font-weight="400" font-family="Arial,Helvetica,sans-serif">How many people are on your sales team?</text><path d="M65 566L699 566" fill="none" stroke="#d8e8f0" /><text x="67" y="596" fill="#24516c" font-size="14" font-weight="600" font-family="Arial,Helvetica,sans-serif">A conversation with a clear next step.</text><text x="67" y="625" fill="#6e8d9f" font-size="12" font-weight="400" font-family="Arial,Helvetica,sans-serif">Ask. Qualify. Book. Share the context.</text><rect x="67" y="645" width="123" height="24" rx="12" fill="#e3f2f6" stroke="none"/><text x="77" y="661" fill="#52899b" font-size="10" font-weight="600" font-family="Arial,Helvetica,sans-serif">Illustrative flow</text><rect x="746" y="444" width="410" height="239" rx="12" fill="#163d55" stroke="#35657b"/><text x="773" y="479" fill="#80bbcf" font-size="9" font-weight="700" font-family="Arial,Helvetica,sans-serif">HANDOFF SUMMARY</text><text x="773" y="518" fill="#e3f6ff" font-size="20" font-weight="600" font-family="Arial,Helvetica,sans-serif">Context for the rep</text><text x="773" y="551" fill="#accddc" font-size="13" font-weight="400" font-family="Arial,Helvetica,sans-serif">✓  Qualification answers</text><text x="773" y="579" fill="#accddd" font-size="13" font-weight="400" font-family="Arial,Helvetica,sans-serif">✓  Lead score and call summary</text><text x="773" y="607" fill="#accddc" font-size="13" font-weight="400" font-family="Arial,Helvetica,sans-serif">✓  Meeting details</text><path d="M773 632L1129 632" fill="none" stroke="#35657b" /><text x="773" y="658" fill="#8fb6c9" font-size="12" font-weight="400" font-family="Arial,Helvetica,sans-serif">Keep the follow-up inside the workflow.</text></svg>
