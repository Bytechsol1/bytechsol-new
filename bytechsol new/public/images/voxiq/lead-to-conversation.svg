<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>Voxiq AI agent qualification and handoff — illustrative workflow</title><desc>Illustration based on the supplied Voxiq case study. Sample content; not a product screenshot.</desc><rect x="0" y="0" width="1200" height="730" rx="14" fill="#102e45" stroke="none"/><circle cx="55" cy="49" r="16" fill="#102e45" stroke="none"/><path d="M42 49h7l4-9 5 19 4-10h7" fill="none" stroke="#76dfec" stroke-width="2.5" stroke-linejoin="round"/><text x="79" y="57" fill="#fff" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif">voxiq</text><rect x="1013" y="42" width="140" height="24" rx="12" fill="#1f4f64" stroke="none"/><text x="1023" y="58" fill="#83dfeb" font-size="10" font-weight="600" font-family="Arial,Helvetica,sans-serif">Early access</text><text x="43" y="124" fill="#effaff" font-size="29" font-weight="600" font-family="Arial,Helvetica,sans-serif">From a new lead to a useful conversation.</text><text x="43" y="155" fill="#99bdcf" font-size="14" font-weight="400" font-family="Arial,Helvetica,sans-serif">Qualification, booking and a human handoff, connected to the CRM.</text><rect x="42" y="204" width="254" height="205" rx="12" fill="#183c54" stroke="#32586f"/><circle cx="76" cy="240" r="14" fill="#275c72" stroke="none"/><text x="69" y="244" fill="#8ce3ec" font-size="10" font-weight="600" font-family="Arial,Helvetica,sans-serif">01</text><text x="64" y="294" fill="#e7f7ff" font-size="18" font-weight="600" font-family="Arial,Helvetica,sans-serif">New lead</text><text x="64" y="328" fill="#a2c0d2" font-size="12" font-weight="400" font-family="Arial,Helvetica,sans-serif">A form or CRM event</text><text x="64" y="350" fill="#a2c0d2" font-size="12" font-weight="400" font-family="Arial,Helvetica,sans-serif">starts the workflow.</text><text x="306" y="308" fill="#6eb8cb" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">→</text><rect 