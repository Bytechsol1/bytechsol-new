<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>Voxiq voice and messaging connections to CRM systems and APIs</title><desc>Illustration based on the supplied Voxiq case study. Sample content; not a product screenshot.</desc><rect x="0" y="0" width="1200" height="620" rx="14" fill="#f6fafc" stroke="none"/><text x="43" y="58" fill="#173e57" font-size="28" font-weight="600" font-family="Arial,Helvetica,sans-serif">One calling workspace. Connected systems.</text><text x="43" y="88" fill="#738fa2" font-size="13" font-weight="400" font-family="Arial,Helvetica,sans-serif">Contact data flows in. Conversations, outcomes and follow-ups flow back.</text><rect x="42" y="165" width="240" height="324" rx="12" fill="#fff" stroke="#d6e5ed"/><text x="66" y="203" fill="#66899f" font-size="9" font-weight="600" font-family="Arial,Helvetica,sans-serif">CONVERSATION CHANNELS</text><rect x="64" y="232" width="196" height="50" rx="8" fill="#eaf5fb" stroke="none"/><circle cx="84" cy="257" r="6" fill="#48a9c6" stroke="none"/><text x="102" y="262" fill="#2c617b" font-size="14" font-weight="600" font-family="Arial,Helvetica,sans-serif">Voice calls</text><rect x="64" y="305" width="196" height="50" rx="8" fill="#eaf5fb" stroke="none"/><circle cx="84" cy="330" r="6" fill="#48a9c6" stroke="none"/><text x="102" y="335" fill="#2c617b" font-size="14" font-weight="600" font-family="Arial,Helvetica,sans-serif">SMS</text><rect x="64" y="378" width="196" height="50" rx="8" fill="#ecf8f2" stroke="none"/><circle cx="84" cy="403" r="6" fill="#48b495" stroke="none"/><text x="102" y="408" fill="#2c617b" font-size="14" font-weight="600" font-family="Arial,Helvetica,sans-serif">WhatsApp</text><path d="M282 327L404 327" fill="none" stroke="#77b4c8" stroke-width="2"/><text x="308" y="312" fill="#658b9f" font-size="10" font-weight="400" font-family="Arial,Helvetica,sans-serif">shared inbox</text><rect x="405" y="240" width="310" height="175" rx="14" fill=