<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bytechsol</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Bytechsol is a full-service software agency offering web development, AI/ML solutions, ERP implementation, and digital marketing."
    />
    <meta
      name="keywords"
      content="software development, web development, AI solutions, ERP, Odoo, digital marketing, SaaS, React development"
    />
    <meta name="author" content="Bytechsol" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Bytechsol - Your Trusted Technology Partner" />
    <meta property="og:description" content="Bytechsol is a full-service software agency offering web development, AI/ML solutions, ERP implementation, and digital marketing." />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:url" content="https://www.bytechsol.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:title" content="Bytechsol - Your Trusted Technology Partner" />
    <meta name="twitter:description" content="Bytechsol is a full-service software agency offering web development, AI/ML solutions, ERP implementation, and digital marketing." />
    <meta name="twitter:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect for faster CDN loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- Preload Fonts -->
    <link rel="preload" href="/Fonts/Guminert-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/Fonts/Guminert-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.bytechsol.com" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/path/to/your/custom/styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React main bundle -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Bootstrap JS -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
